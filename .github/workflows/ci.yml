name: AgriConnect CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sih26033
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Set up Database Schema
      run: |
        psql -h localhost -U postgres -d sih26033 -f backend/setup-db.sql
        psql -h localhost -U postgres -d sih26033 -f backend/migrations/002_data_provenance.sql

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Database Migrations
      run: |
        cd backend
        DATABASE_URL=postgresql://postgres@localhost:5432/sih26033 node migrate.js

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Start Backend Server
      run: |
        cd backend
        DATABASE_URL=postgresql://postgres@localhost:5432/sih26033 JWT_SECRET=testjwtsecretkeyformvp MANDI_API_KEY=testkey VARIETY_API_KEY=testkey BREVO_API_KEY=testkey NODE_ENV=test node server.js &
        sleep 5

    - name: Run E2E Regression Tests
      run: |
        cd backend
        DATABASE_URL=postgresql://postgres@localhost:5432/sih26033 NODE_ENV=test node tests/regression-suite.js
